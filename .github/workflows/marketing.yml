name: Deploy marketing site to usm.dev

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "schema/**"
      - "package.json"
      - ".github/workflows/marketing.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Copy schema files to public directory
        run: |
          mkdir -p web/public/schema
          cp schema/*.json web/public/schema/

      - name: Build marketing site
        working-directory: web
        run: npm run build

      # Cache fix: HTML must always revalidate (edge caches were serving stale
      # sites after back-to-back deploys); hashed assets stay immutable.
      - name: Write cache headers
        run: |
          printf '/*\n  Cache-Control: public, max-age=0, must-revalidate\n/_next/static/*\n  Cache-Control: public, max-age=31536000, immutable\n' > web/out/_headers

      - name: Install wrangler
        run: npm install -g wrangler@3

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Passed via the environment, never interpolated into the script.
          # `${{ ... }}` substitution happens before the shell parses the line,
          # so a commit message containing a quote or backtick would break the
          # command apart — and a backtick would execute as a command (the
          # same bug fixed in safekeys ffe9aa0). An env var is data, not code.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          wrangler pages deploy web/out \
            --project-name=usm-dev \
            --branch=main \
            --commit-dirty=true \
            --commit-message="$COMMIT_MESSAGE"
