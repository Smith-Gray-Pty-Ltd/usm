name: Release

on:
  push:
    branches: [main]

# Cancel in-progress runs for the same ref when a new push lands.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    # Grant the default GITHUB_TOKEN write access for the Version Packages PR.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so changesets can compute the diff.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1. Node 22 bundles
      # npm 10.x, so upgrade explicitly. changesets shells out to `npm publish`,
      # which auto-detects the OIDC environment — no publish token needed.
      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Build
        run: pnpm run build

      # changesets/action does two things:
      #   - If there are pending changesets → open/update a "Version Packages" PR
      #     that bumps package.json + CHANGELOG.md (no publish yet).
      #   - If a Version Packages PR was just merged (no pending changesets) →
      #     publish to npm.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version-packages
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          # Use a real user token (CS_GITHUB_TOKEN) instead of the default
          # GITHUB_TOKEN. This does two things:
          #   1. bypasses the org-level block on the GITHUB_TOKEN creating PRs
          #   2. avoids the `action_required` gate on CI for bot-pushed commits
          #      (GitHub's anti-loop protection only applies to the GITHUB_TOKEN)
          GITHUB_TOKEN: ${{ secrets.CS_GITHUB_TOKEN }}
          # Publish auth comes from trusted publishing (OIDC): setup-node's
          # registry-url + the id-token: write permission. No NPM_TOKEN secret.
          # See https://docs.npmjs.com/trusted-publishers
